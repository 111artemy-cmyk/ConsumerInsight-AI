name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # cache: pip disabled — pip cache occasionally serves a stale
          # partial install and pytest was reported as "No module named".
          # A clean re-install on every run is slower but safer for CI.

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest / black / ruff 来自 requirements-dev.txt
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Smoke test — run_pipeline.py (mock LLM, n=120 reviews)
        run: |
          python scripts/run_pipeline.py --n 120 --backend mock
          python -c "import os, sys; sys.exit(0 if os.path.exists('outputs/reports/pipeline_report.md') and os.path.exists('outputs/figures/07_roi_by_segment.png') else 1)"

      - name: Upload artefacts (figures + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-py${{ matrix.python-version }}
          path: |
            outputs/figures/
            outputs/reports/
          if-no-files-found: ignore