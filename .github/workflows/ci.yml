name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          # CI 用 — pure python 标准库子集；streamlit 是 Streamlit demo 的依赖，
          # pytest 时不需要拉它，但 run_pipeline 用了，所以保留。
          python -c "import importlib; assert importlib.import_module('streamlit')"

      - name: Run pytest
        run: |
          python -m pytest tests/ -q --tb=short
          echo "exit_status=$?"

      - name: Smoke test — run_pipeline.py (mock LLM, n=120 reviews)
        run: |
          python scripts/run_pipeline.py --n 120 --backend mock
          # 校验关键文件确实生成
          test -f outputs/reports/pipeline_report.md
          test -f outputs/figures/07_roi_by_segment.png

      - name: Upload artefacts (figures + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-py${{ matrix.python-version }}
          path: |
            outputs/figures/
            outputs/reports/
          if-no-files-found: ignore